<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8e8df">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%2366766a' d='M3 28h26v-3H3zm3-5h20v-9H6zm1-11h18C24 6 21 4 17 3V0h-2v3C11 4 8 6 7 12'/%3E%3C/svg%3E">
  <title>圣彼得大教堂 · 三维漫游</title>
  <link rel="stylesheet" href="./style.css">

</head>
<body>
  <main id="viewport" aria-label="圣彼得大教堂三维模型"></main>
  <header class="title-card">
    <div class="eyebrow"><span class="mark">✦</span> VATICAN CITY <span class="divider"></span> 3D EXPLORER</div>
    <h1>圣彼得大教堂</h1>
    <p>St. Peter’s Basilica</p>
    <span class="edition"><span class="dot"></span> 1748年布局参考 · 艺术复原</span>
  </header>
  <div class="tools" aria-label="查看工具">
    <button id="auto-rotate" data-requires-model aria-pressed="false" title="自动旋转 · 空格键"><svg viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 .4 7M20 3v5h-5"/></svg><span>自动旋转</span></button>
    <button id="reset" data-requires-model title="回到初始视角 · H"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M6 9v12h12V9M10 21v-7h4v7"/></svg><span>复位</span></button>
    <button id="fullscreen" title="全屏查看"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span>全屏</span></button>
    <button id="hide-ui" title="隐藏界面 · Tab"><svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 10.7a2 2 0 0 0 2.7 2.7M9.9 4.2A10.7 10.7 0 0 1 12 4c5.5 0 9 6 9 6a15.7 15.7 0 0 1-2.1 2.7M6.6 6.7C4.3 8.2 3 10 3 10s3.5 6 9 6c1 0 1.9-.2 2.7-.5"/></svg><span>隐藏界面</span></button>
    <a class="tool-link" href="../../" target="_top" title="回到 仪绘士 · 画境长廊"><svg viewBox="0 0 24 24"><path d="M11 5 4 12l7 7M4 12h16"/></svg><span>返回作品集</span></a>
  </div>
  <button id="show-ui" hidden title="显示界面 · Tab"><svg viewBox="0 0 24 24"><path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.7"/></svg><span>显示界面</span><kbd>Tab</kbd></button>
  <div class="lighting-switch" role="group" aria-label="场景时间">
    <button data-lighting-choice="day" aria-pressed="true" title="白昼 · B"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>白昼</span></button>
    <button data-lighting-choice="night" aria-pressed="false" title="夜景 · N"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.1A8.8 8.8 0 0 1 9.9 3.5 8.8 8.8 0 1 0 20.5 14.1Z"/></svg><span>夜景</span></button>
  </div>
  <aside class="scene-note">
    <div class="small-label">EXPLORE THE ARCHITECTURE</div>
    <div id="view-name">教堂与圣彼得广场</div>
    <p id="view-description">从穹顶到柱廊，沿中轴线展开的建筑全景。</p>
    <button id="context-toggle" data-requires-model aria-pressed="true"><span class="toggle-track"><span></span></span> 显示周边环境</button>
  </aside>
  <div id="loading" role="status" aria-live="polite">
    <div class="loading-symbol">✦</div><h2>正在打开圣彼得大教堂</h2>
    <p id="loading-label">载入建筑细节…</p>
    <div class="progress-track"><div id="progress-bar"></div></div>
    <button id="retry" hidden>重新载入</button>
  </div>
  <div id="status" class="status" role="status" aria-live="polite">载入模型中</div>
  <footer>
    <nav class="views" aria-label="预设视角">
      <button data-view="overview" data-requires-model aria-pressed="true" title="快捷键 1"><span class="view-number">01</span> 航拍全景</button>
      <button data-view="facade" data-requires-model aria-pressed="false" title="快捷键 2"><span class="view-number">02</span> 正面立面</button>
      <button data-view="dome" data-requires-model aria-pressed="false" title="快捷键 3"><span class="view-number">03</span> 穹顶细节</button>
      <button data-view="plan" data-requires-model aria-pressed="false" title="快捷键 4"><span class="view-number">04</span> 俯视布局</button>
      <button data-view="reverse" data-requires-model aria-pressed="false" title="快捷键 5"><span class="view-number">05</span> 后侧视角</button>
      <button data-view="town" data-requires-model aria-pressed="false" title="快捷键 6"><span class="view-number">06</span> 红瓦街巷</button>
      <button data-view="garden" data-requires-model aria-pressed="false" title="快捷键 7"><span class="view-number">07</span> 花园树木</button>
    </nav>
    <p class="gesture-hint"><span class="desktop-hint">1–7 切换视角 <i>·</i> B 白昼 <i>·</i> N 夜景 <i>·</i> 空格 旋转 <i>·</i> 双击聚焦 <i>·</i> Tab 隐藏界面</span><span class="touch-hint">单指旋转 <i>·</i> 双指缩放与平移 <i>·</i> 双击聚焦</span></p>
  </footer>
  <noscript>请启用 JavaScript，以旋转查看三维模型。</noscript>
  <script src="./controls-suite.js?v=001"></script>
  <script type="module" src="./app.js?v=tcs006"></script>
</body>
</html>
